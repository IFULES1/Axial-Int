# /etc/nginx/sites-available/axial  → lien vers sites-enabled/
# NE touche PAS au bloc insight-mvp existant. Ce bloc sert la NOUVELLE app.
# Front Next.js :3005, backend FastAPI :8090. /api/ → backend (préfixe retiré).

server {
    listen 80;
    server_name app.axial-ia.fr;

    client_max_body_size 25m;   # uploads de documents

    # API : /api/... → backend (le slash final du proxy_pass retire "/api")
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # analyses/veille longues
    }

    # Front : tout le reste → Next.js
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
