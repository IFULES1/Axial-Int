# /etc/nginx/sites-available/axial  → lien vers sites-enabled/
# NE touche PAS au bloc insight-mvp existant. Ce bloc sert la NOUVELLE app.
# Front Next.js :3005, backend FastAPI :8090. /api/ → backend (préfixe retiré).

server {
    listen 80;
    server_name app.axial-ia.fr;

    client_max_body_size 25m;   # uploads de documents

    # API : /api/... → backend (le slash final du proxy_pass retire "/api")
    location /api/ {
        proxy_pass http://127.0.0.1:8090/;
        # HTTP/1.1 obligatoire pour le SSE : en HTTP/1.0 nginx bufferise et le
        # flux de génération arrive d'un seul bloc, à la fin. Présent sur le
        # bloc « / » depuis toujours, il manquait ici.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 1800 s = l'échéance globale d'un rapport (`DELAI_MAX_RAPPORT_SECONDES`,
        # app/config.py). `POST /analysis/run` — le repli bloquant du flux —
        # tient la requête ouverte pendant TOUTE la génération : à 300 s, nginx
        # rendait un 504 sur un rapport de 32 000 tokens qui se terminait
        # normalement et était débité. Le front, lui, voyait une erreur.
        # Le flux SSE est protégé en plus par son battement (`: keepalive`
        # toutes les 15 s, app/modules/analysis/service.py) : ce timeout-ci est
        # une borne, pas le mécanisme.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # Pas de tampon sur le flux : le backend pose déjà `X-Accel-Buffering:
        # no`, cette ligne le rend explicite pour qui relit la configuration.
        proxy_buffering off;
    }

    # Front : tout le reste → Next.js
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
